name: Sift
options:
  bundleIdPrefix: me.adithyan.shalinth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: 649T62WKAQ
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Sift:
    type: application
    platform: iOS
    sources:
      - path: Sift
      - path: Shared
    dependencies:
      - target: SiftWidget
    entitlements:
      path: Sift/Sift.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.adithyan.shalinth.Sift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.Sift
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: accent
        CODE_SIGN_STYLE: Automatic
    info:
      path: Sift/Info.plist
      properties:
        CFBundleDisplayName: Sift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: canvas
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        NSPhotoLibraryUsageDescription: "Sift looks at the photos and videos on this iPhone to find duplicates, screenshots and large videos. Nothing is uploaded."
        NSContactsUsageDescription: "Sift checks the contacts on this iPhone to find duplicates you can merge. Nothing is uploaded."
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        NSCalendarsFullAccessUsageDescription: "Sift looks for duplicate events and events over a year old in your calendars on this iPhone. Nothing is uploaded, and nothing is removed until you confirm."
        NSFaceIDUsageDescription: "Sift uses Face ID to unlock your private vault."

  SiftWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SiftWidget
      - path: Shared
    entitlements:
      path: SiftWidget/SiftWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.adithyan.shalinth.Sift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.Sift.Widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: accent
        SKIP_INSTALL: YES
    info:
      path: SiftWidget/Info.plist
      properties:
        CFBundleDisplayName: Sift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SiftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SiftTests
    dependencies:
      - target: Sift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.adithyan.shalinth.SiftTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sift.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Sift
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Sift:
    build:
      targets:
        Sift: all
        SiftTests: [test]
    test:
      targets:
        - SiftTests
      gatherCoverageData: true
